spring:
  datasource:
    url: jdbc:h2:mem:peopledb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  security:
    username: testuser
    password: testpassword
  nationalize:
    base-url: https://api.nationalize.io
    connect-timeout: 1s
    read-timeout: 1s
